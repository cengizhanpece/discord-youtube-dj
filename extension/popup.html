<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #fff; --text: #1f2328; --muted: #656d76; --border: #d8dee4; --accent: #5865f2; --ok: #1a7f37; --err: #cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1d21; --text: #e6e7ea; --muted: #9a9ca3; --border: #2e3036; --accent: #7983f5; --ok: #3fb950; --err: #f85149; }
  }
  body { margin: 0; width: 320px; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
  .wrap { padding: 14px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .top img { width: 28px; height: 28px; border-radius: 6px; }
  .top .name { font-weight: 600; font-size: 14px; flex: 1; }
  .status { display: flex; align-items: center; gap: 6px; color: var(--muted); margin-top: 2px; font-size: 12px; font-weight: 400; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.err { background: var(--err); }
  .switch { position: relative; width: 40px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--border); border-radius: 22px; cursor: pointer; transition: .2s; }
  .slider:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider:before { transform: translateX(18px); }
  input:disabled + .slider { opacity: .5; cursor: not-allowed; }
  .section { margin-top: 14px; }
  label.lbl { display: block; color: var(--muted); margin-bottom: 4px; font-size: 12px; }
  select, input[type=text] { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
  .np { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; display: flex; gap: 8px; align-items: center; }
  .np .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  .help { background: color-mix(in srgb, var(--err) 10%, transparent); border-radius: 8px; padding: 10px; }
  a { color: var(--accent); }
  details summary { cursor: pointer; color: var(--muted); }
  .check { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .foot { margin-top: 14px; display: flex; justify-content: space-between; font-size: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img src="icons/48.png" alt="">
    <div class="name">
      <span data-msg="extName"></span>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText"></span></div>
    </div>
    <label class="switch" data-msg-title="toggleTitle">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="section help hidden" id="offline">
    <div data-msg="offlineText"></div>
    <div style="margin-top:6px"><a id="downloadLink" target="_blank" data-msg="downloadBot"></a></div>
  </div>

  <div class="section hidden" id="online">
    <label class="lbl" for="channel" data-msg="voiceChannel"></label>
    <select id="channel"></select>

    <div class="section">
      <label class="lbl" data-msg="nowPlaying"></label>
      <div class="np"><span class="t" id="np"></span><button id="stop" class="hidden" data-msg="stop"></button></div>
    </div>
  </div>

  <details class="section">
    <summary data-msg="settings"></summary>
    <div class="check"><input type="checkbox" id="muteTab"><label for="muteTab" data-msg="muteTab"></label></div>
    <div style="margin-top:8px">
      <label class="lbl" for="botUrl" data-msg="botAddress"></label>
      <input type="text" id="botUrl" spellcheck="false">
    </div>
  </details>

  <div class="foot">
    <a id="dashboard" target="_blank" data-msg="openDashboard"></a>
    <a id="updateLink" class="hidden" target="_blank" data-msg="updateAvailable"></a>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
